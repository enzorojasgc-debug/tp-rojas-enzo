<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Buscador de ubicaciones de Rick and Morty">
  <title>Buscador de Ubicaciones · Rick and Morty</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪐</text></svg>">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header class="encabezado">
    <div class="encabezado__marca">
      <span class="encabezado__icono" aria-hidden="true">🪐</span>
      <h1 class="encabezado__titulo">Buscador de Ubicaciones</h1>
    </div>
    <p class="encabezado__subtitulo">Planetas, estaciones y dimensiones de Rick and Morty</p>
  </header>

  <main class="contenido">
    <section class="buscador" aria-labelledby="titulo-buscador">
      <h2 id="titulo-buscador" class="buscador__titulo">Buscar ubicaciones</h2>

      <form id="formulario-busqueda" class="buscador__formulario" novalidate>
        <div class="campo">
          <label for="campo-nombre">Nombre</label>
          <input type="text" id="campo-nombre" name="nombre" placeholder="Por ejemplo, Earth" autocomplete="off">
        </div>

        <div class="campo">
          <label for="campo-tipo">Tipo</label>
          <input type="text" id="campo-tipo" name="tipo" placeholder="Por ejemplo, Planet" autocomplete="off">
        </div>

        <button type="submit" id="boton-buscar" class="boton">Buscar</button>
      </form>

      <p id="mensaje-estado" class="mensaje" role="status" aria-live="polite"></p>
    </section>

    <section class="resultados" aria-labelledby="titulo-resultados">
      <h2 id="titulo-resultados" class="resultados__titulo">Resultados</h2>
      <div id="contenedor-tarjetas" class="grilla"></div>
    </section>
  </main>

  <footer class="pie">
    <p>Trabajo Práctico · Fundamentos de Desarrollo Web · Enzo Rojas</p>
    <p>Datos: <a href="https://rickandmortyapi.com" target="_blank" rel="noopener">The Rick and Morty API</a></p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
